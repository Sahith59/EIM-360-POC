<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIM 360</title>
<link rel="stylesheet" href="/css/app.css">
</head>
<body>
<div class="shell">
  <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="nav-toggle" aria-label="Toggle navigation"></button>
      <div class="env" id="env"></div><span class="small muted" style="border:1px solid var(--line);border-radius:4px;padding:1px 8px">POC mock · fictional data</span>
      <div class="topbar-right">
        <span class="build" id="build"></span>
        <div class="user" id="user" data-testid="current-role"></div>
      </div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
<div class="modal-root" id="modal"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
